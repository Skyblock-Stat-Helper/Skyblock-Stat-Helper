<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyblock Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;800&family=Fraunces:wght@600;900&family=Nunito:wght@500;800&family=Cormorant+Garamond:wght@600;700&family=Oswald:wght@500;700&family=Rubik:wght@500;800&display=swap">
<style>
:root{--bg:#0e0c0b;--panel:#1a1613;--ink:#f1e6d6;--mute:#a39583;--a:#ff9a3c;--b:#5fd6e0;--bd:#33291f;--hf:"Bitter",Rockwell,Georgia,serif;--bf:system-ui,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--bf);min-height:100vh;transition:background .5s,color .5s}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#torch{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .5s}
body.mining #torch{opacity:1}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1{font:800 2rem/1.1 var(--hf);margin:6px 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
.search{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--panel);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--panel);color:var(--ink);padding:10px 14px}
button.go{background:var(--a);border-color:var(--a);color:#111;font-weight:800}
button:focus-visible,input:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.note{font-size:.85rem;color:var(--mute);border-left:3px solid var(--a);padding:4px 10px;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.tabs button.on{background:var(--a);border-color:var(--a);color:#111;font-weight:800}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.stat h2{font:700 1.15rem var(--hf);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.stat h2 span{color:var(--a);font-family:var(--bf);font-weight:800}
.bar{height:8px;border-radius:6px;background:rgba(127,127,127,.25);overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:6px}
.src{display:flex;justify-content:space-between;font-size:.9rem;padding:3px 0;border-top:1px solid var(--bd)}
.src em{font-style:normal;color:var(--mute)}
h3{font:700 1.2rem var(--hf);margin:18px 0 8px}
.up{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;font-size:.92rem}
.up b{color:var(--a);white-space:nowrap}
.ol{margin:6px 0 0;padding-left:22px}.ol li{padding:2px 0}
.grid{background:linear-gradient(var(--bd),var(--bd)) 50% 0/2px 100% no-repeat;padding:6px 0;margin:8px 0}
.trow{display:flex;justify-content:center;align-items:center;gap:5px;margin:7px 0;position:relative}
.trow i{position:absolute;left:0;font-style:normal;font-size:.7rem;color:var(--mute)}
.node{width:40px;height:40px;padding:0;border-radius:10px;font-size:.72rem;font-weight:800;background:var(--panel);color:var(--mute);border:1px solid var(--bd);opacity:.45}
.node.ab{border-radius:50%}
.node.m{background:var(--a);border-color:var(--a);color:#111;opacity:1}
.node.a{background:var(--b);border-color:var(--b);color:#111;opacity:1}
.node.r{border:2px dashed var(--a);color:var(--a);opacity:1}
.node.o{border:2px solid var(--b);color:var(--b);opacity:1}
.node.c{box-shadow:0 0 0 3px #e8c34a;opacity:1;color:var(--ink);border-color:#e8c34a}
.tip{font-size:.9rem;color:var(--mute);margin:4px 0}.tip b{color:var(--ink)}
input.n{flex:none;width:78px;padding:3px 6px;border-radius:8px;text-align:right;font-size:.9rem}
.src2{font-size:.8rem;color:var(--mute);margin-top:6px}
</style>
</head>
<body class="mining">
<canvas id="fx" aria-hidden="true"></canvas>
<div id="torch" aria-hidden="true"></div>
<main>
<h1 id="title">Mining</h1>
<p class="sub" id="tag">Every point of your stats, source by source.</p>
<div class="search"><input id="user" placeholder="Minecraft username" autocomplete="off"><button class="go" id="look">Look up</button></div>
<p class="note" id="msg">Type your own numbers into the boxes and the totals update. They are saved on this device. Starting values are demo numbers, and username lookup is not connected yet.</p>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="stats"></div>
<div id="tree"></div>
<h3>Cheapest upgrades</h3>
<div id="ups"></div>
</main>
